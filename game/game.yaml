title: Rzk Warm-up

# The default Rzk tutorial: an on-ramp to Rzk's type theory, built by filling
# holes. It starts from nothing and, over later chapters, arrives at a first
# taste of directed types. See notes/content-map.md for the full chapter/section
# plan (mapping the BMSTU tutorial), and notes/conventions.md for the authoring
# rules. Chapters "Equivalences and univalence" and "A taste of directed types"
# are planned but not yet authored.
